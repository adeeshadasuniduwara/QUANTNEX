name: QUANTNEX Telegram Release Announcements

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram release announcement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping announcement."
            exit 0
          fi
          python - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              title = "Telegram notification test"
              tag = "Configuration test"
              release_url = "https://github.com/" + repo
              intro = "The QUANTNEX Telegram release notification is connected."
          elif os.environ["EVENT_NAME"] == "push":
              sha = os.environ.get("COMMIT_SHA", "")
              title = html.escape((os.environ.get("COMMIT_MESSAGE") or "QUANTNEX source update").splitlines()[0][:160])
              tag = "main@" + sha[:7]
              release_url = "https://github.com/" + repo + "/commit/" + sha
              intro = (
                  "A new QUANTNEX update has been merged into the official main branch.\n"
                  "The running source-based workspace will download changed files and apply the update automatically.\n"
                  "🔒 Local wallet, journal, settings and credentials remain on this computer."
              )
          else:
              title = html.escape(os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "New release")
              tag = html.escape(os.environ.get("RELEASE_TAG") or "Release")
              release_url = os.environ.get("RELEASE_URL") or ("https://github.com/" + repo + "/releases")
              intro = "A new QUANTNEX version has been published."

          message = (
              "🚀 <b>QUANTNEX — NEW UPDATE AVAILABLE!</b>\n\n"
              + "<b>" + title + "</b>\n"
              + "Version: <code>" + tag + "</code>\n\n"
              + intro + "\n\n"
              + '<a href="' + release_url + '">Open release &amp; downloads</a>\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\n\n'
              + "<i>Official automated update notification</i>"
          )

          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", "replace")
              try:
                  detail = json.loads(raw).get("description") or raw[:300]
              except (ValueError, AttributeError):
                  detail = raw[:300] or str(exc.reason)
              raise SystemExit(
                  f"Telegram sendMessage failed (HTTP {exc.code}): {detail}. "
                  "Check TELEGRAM_CHAT_ID and confirm the bot can message that chat "
                  "(the user must start it with /start, or the bot must be added to the group)."
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"Telegram network request failed: {exc.reason}") from None

          if not result.get("ok"):
              raise SystemExit(
                  "Telegram API rejected the announcement: "
                  + str(result.get("description") or "unknown Telegram API error")
              )
          print("Telegram announcement sent successfully.")
          PY
