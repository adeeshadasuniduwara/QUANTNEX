name: QUANTNEX Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.6.1)"
        required: true
        default: "v0.6.1"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m py_compile apps/windows/quantnex_desktop.py

      - name: Stamp release version into Windows app
        shell: pwsh
        env:
          QUANTNEX_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:QUANTNEX_RELEASE_VERSION.TrimStart('v')
          $path = "apps/windows/quantnex_desktop.py"
          $source = Get-Content -Raw -LiteralPath $path
          $updated = [regex]::Replace($source, '(?m)^APP_VERSION = "[^"]+"$', ('APP_VERSION = "' + $version + '"'), 1)
          if ($updated -eq $source) { throw "APP_VERSION marker was not found." }
          Set-Content -LiteralPath $path -Value $updated -Encoding utf8 -NoNewline

      - name: Build Windows executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QUANTNEX apps/windows/quantnex_desktop.py

      - name: Set up Java for Android release
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android signing keystore
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw "Missing ANDROID_KEYSTORE_BASE64 repository secret. Configure the stable Android signing keystore before publishing a release."
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("$PWD/apps/android/quantnex-release.p12", $bytes)

      - name: Build signed Android APK
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/quantnex-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease -PandroidVersionCode=${{ github.run_number }} -PandroidVersionName=${{ inputs.version || github.ref_name }}
          New-Item -ItemType Directory -Force -Path ../../dist | Out-Null
          Copy-Item app/build/outputs/apk/release/app-release.apk ../../dist/QUANTNEX-Android.apk

      - name: Remove temporary signing keystore
        if: always() && env.ANDROID_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue apps/android/quantnex-release.p12

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QUANTNEX.exe -Algorithm SHA256).Hash
          "$hash  QUANTNEX.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          if (Test-Path dist/QUANTNEX-Android.apk) {
            $apkHash = (Get-FileHash dist/QUANTNEX-Android.apk -Algorithm SHA256).Hash
            "$apkHash  QUANTNEX-Android.apk" | Add-Content -Encoding ascii dist/SHA256SUMS.txt
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: main
          name: QUANTNEX ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release on Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping announcement."
            exit 0
          fi
          python - <<'PY'
          import html, json, os, urllib.request
          tag = html.escape(os.environ["RELEASE_TAG"])
          repo = os.environ["REPO"]
          release_url = os.environ["RELEASE_URL"]
          message = (
              "🚀 <b>QUANTNEX — NEW UPDATE AVAILABLE!</b>\n\n"
              + "Version: <code>" + tag + "</code>\n\n"
              + "A new QUANTNEX release has been published.\n\n"
              + '<a href="' + release_url + '">Open release &amp; downloads</a>\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\n\n'
              + "<i>Official automated update notification</i>"
          )
          payload = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                                "text": message, "parse_mode": "HTML"}).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram API rejected the release announcement.")
          print("Telegram release announcement sent.")
          PY
