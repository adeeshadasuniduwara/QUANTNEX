name: QUANTNEX Telegram Release Announcements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/index.html"
      - "apps/web/goals.js"
      - "apps/web/goals.test.cjs"
      - "backend/app/main.py"
      - "backend/app/goal_certificates.py"
      - "backend/app/telegram_worker.py"
      - "backend/test_goal_certificates.py"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/telegram-release-notify.yml"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram release announcement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping announcement."
            exit 0
          fi
          python - <<'PY'
          import html
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              title = "Telegram notification test"
              tag = "Configuration test"
              release_url = "https://github.com/" + repo
              intro = "The QUANTNEX Telegram release notification is connected."
          elif os.environ["EVENT_NAME"] == "push":
              title = "Goals, demo certificate & Telegram message polish"
              tag = "Workspace update"
              release_url = "https://github.com/" + repo + "/commit/" + os.environ.get("COMMIT_SHA", "")
              intro = (
                  "🎯 Personal goals creation and progress experience improved.\\n"
                  "🏅 A sample achievement certificate is now available, prominently marked DEMO ONLY — NOT VALID.\\n"
                  "💬 Telegram messages now use clearer branded formatting and helpful emojis.\\n"
                  "🔒 Your local wallet, journal, settings and credentials remain on your device."
              )
          else:
              title = html.escape(os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "New release")
              tag = html.escape(os.environ.get("RELEASE_TAG") or "Release")
              release_url = os.environ.get("RELEASE_URL") or ("https://github.com/" + repo + "/releases")
              intro = "A new QUANTNEX version has been published."

          message = (
              "🚀 <b>QUANTNEX — NEW UPDATE AVAILABLE!</b>\n\n"
              + "<b>" + title + "</b>\n"
              + "Version: <code>" + tag + "</code>\n\n"
              + intro + "\n\n"
              + '<a href="' + release_url + '">Open release &amp; downloads</a>\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\n\n'
              + "<i>Official automated update notification</i>"
          )

          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram API rejected the announcement.")
          print("Telegram announcement sent successfully.")
          PY
