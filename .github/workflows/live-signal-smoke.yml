name: QUANTNEX Live Crypto Signal Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/smoke_signal_engine.py"
      - "backend/app/binance_usdm_market_data.py"
      - "backend/app/binance_usdm_signal_engine.py"
      - ".github/workflows/live-signal-smoke.yml"
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  live-crypto-smoke:
    name: Read-only Binance Spot and USDⓈ-M smoke scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dynamic Binance Spot and USDⓈ-M Futures smoke samples
        run: python smoke_signal_engine.py --universe-sample-size 20 --usdm-universe-sample-size 20
