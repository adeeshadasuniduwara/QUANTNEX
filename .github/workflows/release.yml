name: QUANTNEX Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Android release version (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Require stable Android signing credentials
        shell: bash
        run: |
          if [ "${ANDROID_SIGNING_CONFIGURED}" != "true" ]; then
            echo "::error::Android release signing is not configured."
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository Actions secrets."
            echo "A stable signing key is required so existing APK installations can update safely."
            exit 1
          fi

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p apps/android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android/quantnex-release.p12
          test -s apps/android/quantnex-release.p12

      - name: Build signed Android APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/quantnex-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon assembleRelease -PandroidVersionCode=${{ github.run_number }} -PandroidVersionName=${{ inputs.version || github.ref_name }}
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/QUANTNEX-Android.apk
          test -s ../../dist/QUANTNEX-Android.apk

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f apps/android/quantnex-release.p12

      - name: Generate Android APK SHA256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum QUANTNEX-Android.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload Android APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUANTNEX-Android-${{ github.sha }}
          path: |
            dist/QUANTNEX-Android.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: main
          name: QUANTNEX Android ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/QUANTNEX-Android.apk
            dist/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce Android release on Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping announcement."
            exit 0
          fi
          python - <<'PY'
          import html, json, os, urllib.request
          tag = html.escape(os.environ["RELEASE_TAG"])
          repo = os.environ["REPO"]
          release_url = os.environ["RELEASE_URL"]
          message = (
              "🚀 <b>QUANTNEX ANDROID — NEW APK RELEASE!</b>\n\n"
              + "Version: <code>" + tag + "</code>\n\n"
              + "A new signed QUANTNEX Android APK is available.\n\n"
              + '<a href="' + release_url + '">Open APK download</a>\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\n\n'
              + "<i>Official automated release notification</i>"
          )
          payload = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                                "text": message, "parse_mode": "HTML"}).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram API rejected the Android release announcement.")
          print("Telegram Android release announcement sent.")
          PY
