name: QUANTNEX Windows Build

on:
  pull_request:
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release.yml"
      - "run_quantnex.bat"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/android/**"
      - "apps/web/**"
      - "backend/**"
      - "shared/**"
      - ".github/workflows/windows-build.yml"
      - "run_quantnex.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile apps/windows/quantnex_desktop.py
      - name: Build EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QUANTNEX apps/windows/quantnex_desktop.py
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QUANTNEX.exe -Algorithm SHA256).Hash
          "$hash  QUANTNEX.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUANTNEX-Windows-${{ github.sha }}
          path: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
