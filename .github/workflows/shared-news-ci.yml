name: QUANTNEX Shared News CI

on:
  pull_request:
    paths:
      - "services/shared-news/**"
      - ".github/workflows/shared-news-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/shared-news/**"
      - ".github/workflows/shared-news-ci.yml"

permissions:
  contents: read

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        working-directory: services/shared-news
        run: npm run check
