name: QUANTNEX Windows Build

on:
  pull_request:
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release.yml"
      - "run_quantnex.bat"
      - "run_quantnex_services.py"
      - "quantnex_updater.py"
      - "backend/**"
      - "apps/web/**"
      - ".github/workflows/backend-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/android/**"
      - "apps/web/**"
      - "backend/**"
      - "shared/**"
      - ".github/workflows/windows-build.yml"
      - "run_quantnex.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python -m py_compile apps/windows/quantnex_desktop.py apps/windows/test_quantnex_desktop.py
          python -m py_compile run_quantnex_services.py quantnex_updater.py backend/bootstrap.py apps/web/quantnex_local_server.py
      - name: Test Windows desktop chart data adapters
        run: python -m unittest discover -s apps/windows -p "test_*.py" -v
      - name: Build EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QUANTNEX apps/windows/quantnex_desktop.py
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QUANTNEX.exe -Algorithm SHA256).Hash
          "$hash  QUANTNEX.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUANTNEX-Windows-${{ github.sha }}
          path: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run backend tests
        run: python -m pytest -q

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Web JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/signal-tool.js
