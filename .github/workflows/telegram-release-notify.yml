name: QUANTNEX Telegram Update Notifications

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram update announcement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping announcement."
            exit 0
          fi
          python - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()

          def telegram_api(method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={"Content-Type": "application/json"} if data is not None else {},
                  method="POST" if data is not None else "GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      detail = json.loads(raw).get("description") or raw[:300]
                  except (ValueError, AttributeError):
                      detail = raw[:300] or str(exc.reason)
                  raise SystemExit(
                      "Telegram " + method + " failed (HTTP " + str(exc.code) + "): " + detail
                  ) from None
              except urllib.error.URLError as exc:
                  raise SystemExit("Telegram network request failed: " + str(exc.reason)) from None
              if not result.get("ok"):
                  raise SystemExit(
                      "Telegram " + method + " was rejected: "
                      + str(result.get("description") or "unknown Telegram API error")
                  )
              return result.get("result") or {}

          # Validate the destination before attempting to send a public update.
          bot = telegram_api("getMe")
          bot_id = str(bot.get("id") or "")
          if chat_id.lstrip("-").isdigit() and chat_id == bot_id:
              raise SystemExit(
                  "TELEGRAM_CHAT_ID points to the bot's own ID. Set it to your private chat ID "
                  "after sending /start to the bot, or to the target group/channel ID after "
                  "adding the bot with permission to post."
              )
          chat = telegram_api("getChat", {"chat_id": chat_id})
          if bot_id and str(chat.get("id") or "") == bot_id:
              raise SystemExit(
                  "TELEGRAM_CHAT_ID resolves to the bot itself. Use your private chat ID or "
                  "a group/channel ID where the bot is allowed to post."
              )

          chat_type = str(chat.get("type") or "")
          if chat_type in ("channel", "group", "supergroup"):
              member = telegram_api("getChatMember", {
                  "chat_id": chat.get("id"),
                  "user_id": int(bot_id),
              })
              member_status = str(member.get("status") or "")
              if chat_type == "channel":
                  if member_status != "creator" and not (
                      member_status == "administrator" and member.get("can_post_messages") is True
                  ):
                      raise SystemExit(
                          "The bot must be a channel administrator with Post Messages permission."
                      )
              elif member_status not in ("member", "administrator", "creator") and not (
                  member_status == "restricted" and member.get("can_send_messages") is True
              ):
                  raise SystemExit("The bot is not allowed to send messages in this group.")
          elif chat_type != "private":
              raise SystemExit("Choose a private chat, group, supergroup or channel as TELEGRAM_CHAT_ID.")

          repo = os.environ["REPO"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              title = "Telegram notification test"
              tag = "Configuration test"
              target_url = "https://github.com/" + repo
              link_label = "Open QUANTNEX repository"
              intro = "The QUANTNEX Telegram update notification is connected."
          elif os.environ["EVENT_NAME"] == "push":
              sha = os.environ.get("COMMIT_SHA", "")
              title = html.escape((os.environ.get("COMMIT_MESSAGE") or "QUANTNEX source update").splitlines()[0][:160])
              tag = "main@" + sha[:7]
              target_url = "https://github.com/" + repo + "/commit/" + sha
              link_label = "View source update"
              intro = (
                  "A new QUANTNEX update has been merged into the official main branch.\n"
                  "The running source-based workspace can download and apply the update automatically.\n"
                  "🔒 Local wallet, journal, settings and credentials remain on this computer."
              )
          else:
              title = html.escape(os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "New release")
              tag = html.escape(os.environ.get("RELEASE_TAG") or "Release")
              target_url = os.environ.get("RELEASE_URL") or ("https://github.com/" + repo + "/releases")
              link_label = "Open release &amp; downloads"
              intro = "A new QUANTNEX version has been published."

          message = (
              "🚀 <b>QUANTNEX — NEW UPDATE AVAILABLE!</b>\n\n"
              + "<b>" + title + "</b>\n"
              + "Version: <code>" + tag + "</code>\n\n"
              + intro + "\n\n"
              + '<a href="' + target_url + '">' + link_label + '</a>\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\n\n'
              + "<i>Official automated update notification</i>"
          )

          telegram_api("sendMessage", {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          })
          print("Telegram announcement sent successfully.")
          PY
