name: QUANTNEX Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/windows/**"
      - "apps/android/**"
      - "apps/web/**"
      - "backend/**"
      - "shared/**"
      - ".github/workflows/windows-build.yml"
      - "run_quantnex.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile apps/windows/quantnex_desktop.py
      - name: Build EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QUANTNEX apps/windows/quantnex_desktop.py
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QUANTNEX.exe -Algorithm SHA256).Hash
          "$hash  QUANTNEX.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: QUANTNEX-Windows-${{ github.sha }}
          path: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release on Telegram
        if: startsWith(github.ref, 'refs/tags/') && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import html, json, os, urllib.request
          tag = html.escape(os.environ["RELEASE_TAG"])
          repo = os.environ["REPO"]
          release_url = os.environ["RELEASE_URL"]
          message = (
              "🚀 <b>QUANTNEX — NEW UPDATE AVAILABLE!</b>\\n\\n"
              + "Version: <code>" + tag + "</code>\\n\\n"
              + "A new QUANTNEX release has been published.\\n\\n"
              + '<a href="' + release_url + '">Open release &amp; downloads</a>\\n'
              + '<a href="https://github.com/' + repo + '">QUANTNEX GitHub</a>\\n\\n'
              + "<i>Official automated update notification</i>"
          )
          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML"
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload, headers={"Content-Type": "application/json"}, method="POST"
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram API rejected the release announcement.")
          print("Telegram release announcement sent.")
          PY
