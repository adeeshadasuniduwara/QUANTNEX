name: QUANTNEX Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Web JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/realtime-events.js
          node --check apps/web/signal-tool.js
          node --check apps/web/goals.js
          node --check apps/web/phase12-20.js
          node --check apps/web/workspace-polish.js
          node --check apps/web/quantnex-view-intelligence.js
          node --check apps/web/workspace-pages.js
          node apps/web/workspace-pages.test.cjs
          node apps/web/live-terminal.test.cjs
          node apps/web/sidebar-scroll.test.cjs
      - name: Validate local updater Python syntax
        run: python -m py_compile apps/web/quantnex_local_server.py
      - name: Verify local-only wallet and updater UI
        run: |
          grep -q 'id="qxSignalIntelligence"' apps/web/index.html
          grep -q 'quantnex-view-intelligence.js' apps/web/index.html
          grep -q 'quantnex-view-intelligence.css' apps/web/index.html
          grep -q 'id="account"' apps/web/index.html
          grep -q 'id="walletDeposit"' apps/web/index.html
          grep -q 'id="walletWithdraw"' apps/web/index.html
          grep -q 'id="walletArea">' apps/web/index.html
          grep -q 'LOCAL DEVICE MODE' apps/web/index.html
          grep -q 'Download &amp; install now' apps/web/index.html
          grep -q 'id="webUpdateModal"' apps/web/index.html
          ! grep -q 'id="accountLogin"' apps/web/index.html
          ! grep -q 'id="accountRegister"' apps/web/index.html
          ! grep -q 'id="accountPassword"' apps/web/index.html
