name: QUANTNEX Backend and Web CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "apps/web/**"
      - ".github/workflows/backend-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "apps/web/**"
      - ".github/workflows/backend-web-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automatic startup preflight
        run: python bootstrap.py
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run backend tests
        run: python -m pytest -q

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Web updater Python syntax
        run: python -m py_compile apps/web/quantnex_local_server.py
      - name: Check web JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/realtime-events.js
          node --check apps/web/signal-tool.js
          node --check apps/web/workspace-pages.js
          node --check apps/web/navigation.js
          node --check apps/web/prop-challenge.js
          node apps/web/workspace-pages.test.cjs
          node apps/web/navigation.test.cjs
