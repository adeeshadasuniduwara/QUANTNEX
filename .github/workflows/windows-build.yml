name: QUANTNEX Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-build.yml"
      - "run_quantnex.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile apps/windows/quantnex_desktop.py
      - name: Build EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QUANTNEX apps/windows/quantnex_desktop.py
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QUANTNEX.exe -Algorithm SHA256).Hash
          "$hash  QUANTNEX.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: QUANTNEX-Windows-${{ github.sha }}
          path: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/QUANTNEX.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
